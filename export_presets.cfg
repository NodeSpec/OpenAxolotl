; PC export presets (REQ-018). PC-only is a firm non-goal boundary -- there is
; deliberately no console preset here and never will be.
;
; include_filter="*.json" is belt-and-braces, not load-bearing today: Godot 4
; imports .json as a resource, so all_resources already ships the world
; manifests and contracts the hub reads at runtime (verified empirically --
; exporting without the filter still packs them). It stays because a future
; engine reclassifying .json must not be able to silently unship every portal;
; the build test asserts the manifests made it into the pack either way.

[preset.0]

name="Linux"
platform="Linux/X11"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="source_assets/*, fixtures/*, .toolchain/*, build/*, test/*, dev/*, tools/*"
export_path="build/linux/OpenAxolotl.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
